name: Deploy docs + Storybook to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install workspace dependencies
        run: yarn install --immutable

      - name: Install docs dependencies
        working-directory: docs
        run: yarn install --immutable

      - name: Build docs and search index
        working-directory: docs
        env:
          NEXT_PUBLIC_GITHUB_PAGES: "true"
        run: |
          yarn build
          yarn postbuild

      - name: Build Storybook
        run: yarn workspace @lwn-simulator/ui-components build-storybook

      - name: Assemble and verify site
        shell: bash
        run: |
          mkdir -p pages/{docs,storybook}
          cp -R docs/out/. pages/docs/
          cp -R packages/ui-components/storybook-static/. pages/storybook/
          cat > pages/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./docs/">
            <title>LWN Simulator documentation</title>
            <a href="./docs/">Open the LWN Simulator documentation</a>
          </html>
          HTML

          test -s pages/docs/index.html
          for locale in en it es fr de; do
            test -s "pages/docs/$locale.html"
          done
          test -s pages/docs/_pagefind/pagefind.js
          test -s pages/storybook/index.html
          test -s pages/storybook/iframe.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
