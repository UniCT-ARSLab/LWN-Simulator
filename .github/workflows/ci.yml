name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache: true
          cache-dependency-path: |
            apps/backend/go.sum
            packages/engine/go.sum

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install documentation dependencies
        working-directory: docs
        run: yarn install --immutable

      - name: Type-check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build frontend assets
        run: yarn workspace @lwn-simulator/frontend build

      - name: Build documentation and search index
        working-directory: docs
        env:
          NEXT_PUBLIC_GITHUB_PAGES: "true"
        run: |
          yarn build
          yarn postbuild

      - name: Build Storybook
        run: yarn workspace @lwn-simulator/ui-components build-storybook

      - name: Test frontend unit suite
        run: yarn test:frontend:coverage

      - name: Test SDK
        run: yarn test:sdk

      - name: Test UI components
        run: yarn test:ui-components

      - name: Install Playwright browsers
        run: yarn workspace @lwn-simulator/frontend exec playwright install --with-deps chromium firefox webkit

      - name: Test frontend user journeys
        run: yarn test:e2e
        env:
          PLAYWRIGHT_REUSE_EXPORT: true
          PLAYWRIGHT_CROSS_BROWSER: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-playwright-report-${{ github.sha }}
          path: apps/frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage-${{ github.sha }}
          path: apps/frontend/coverage
          if-no-files-found: error
          retention-days: 7

      - name: Test backend
        working-directory: apps/backend
        run: go test ./...

      - name: Test engine with coverage
        working-directory: packages/engine
        run: |
          mkdir -p coverage
          go test ./... -covermode=atomic -coverprofile=coverage/engine.out
          coverage="$(go tool cover -func=coverage/engine.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 84.0) { printf "Engine coverage %.1f%% is below the required 84.0%%\n", coverage; exit 1 } printf "Engine coverage %.1f%%\n", coverage }'

      - name: Upload engine coverage
        uses: actions/upload-artifact@v6
        with:
          name: engine-coverage-${{ github.sha }}
          path: packages/engine/coverage/engine.out
          if-no-files-found: error
          retention-days: 7

      - name: Vet backend
        working-directory: apps/backend
        run: go vet ./...

      - name: Vet engine
        working-directory: packages/engine
        run: go vet ./...
